[project]
name = "govdoc-listener"
version = "0.1.0"
description = "Meeting/chat listener that retrieves executive briefs and references from the govdoc-explainer corpus"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "fastembed",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[project.scripts]
govdoc-listener = "listener.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["listener"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
