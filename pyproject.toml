[project]
name = "govdoc-explainer"
version = "2.0.0"
description = "Pre-process government documents into searchable, LLM-summarized static HTML"
readme = "README.md"
requires-python = ">=3.12"
license = "ISC"
dependencies = [
    "requests",
    "beautifulsoup4",
    "pymupdf",
    "python-docx",
    "openpyxl",
    "pandas",
    "litellm",
    "fastembed",
    "scikit-learn",
    "nltk",
    "markdown2",
    "lunr",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
govdoc = "govdoc_explainer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["govdoc_explainer"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
